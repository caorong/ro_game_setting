name: Build pinned upstream index

on:
  workflow_dispatch:
    inputs:
      include_skill_source:
        description: Download and index all split skill implementations
        type: boolean
        default: true
  push:
    branches: [agent/pre-renewal-reference]
    paths: [build-index.ready]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Sync pinned rAthena sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.include_skill_source }}" = "true" ]; then
            python scripts/sync_rathena.py --include-skill-source
          else
            python scripts/sync_rathena.py
          fi
      - run: python scripts/build_reference.py
      - run: python scripts/sync_rathena.py --verify-only
      - uses: actions/upload-artifact@v4
        with:
          name: ro-pre-renewal-${{ github.sha }}
          path: |
            generated/
            vendor/rathena/sync-manifest.json
          retention-days: 14
