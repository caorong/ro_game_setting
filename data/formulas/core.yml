schema_version: 1
ruleset: pre-renewal
source_commit: 2fe6ab3dc4d830b11d93fb44c3b48436571890bd
rounding: Every integer division follows C++ truncation toward zero at that exact operation.
formulas:
- id: status_atk
  status: verified
  expression: main + floor(main / 10)^2 + floor(secondary / 5) + floor(luk / 5)
  main_stat_rule:
    ranged_weapons: DEX
    other_weapons: STR
  secondary_stat_rule:
    ranged_weapons: STR
    other_weapons: DEX
  source:
    path: src/map/status.cpp
    symbol: status_base_atk
- id: matk_min
  status: verified
  expression: int + floor(int / 7)^2
  source:
    path: src/map/status.cpp
    symbol: status_base_matk_min
- id: matk_max
  status: verified
  expression: int + floor(int / 5)^2
  source:
    path: src/map/status.cpp
    symbol: status_base_matk_max
- id: hit
  status: verified
  expression: bonus_hit + base_level + dex
  source:
    path: src/map/status.cpp
    symbol: status_calc_misc
- id: flee
  status: verified
  expression: bonus_flee + base_level + agi
  source:
    path: src/map/status.cpp
    symbol: status_calc_misc
- id: soft_def
  status: verified
